<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technical Manual &middot; KP Astro NSE Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body{margin:0;background:#0d1117;color:#e6edf3;
      font-family:'Segoe UI',Roboto,Arial,sans-serif;line-height:1.6}
    .wrap{max-width:900px;margin:0 auto;padding:32px 24px 80px}
    a.back{color:#33c1b1;text-decoration:none}
    h1,h2,h3{border-bottom:1px solid #2a3340;padding-bottom:6px}
    code{background:#161b22;padding:2px 6px;border-radius:5px;font-size:13px}
    pre{background:#161b22;padding:14px;border-radius:8px;overflow:auto}
    table{border-collapse:collapse;width:100%;margin:14px 0}
    th,td{border:1px solid #2a3340;padding:7px 10px;text-align:left;font-size:14px}
    th{background:#1c2230}
    blockquote{border-left:4px solid #7c5cff;margin:14px 0;padding:6px 14px;
      background:#161b22;color:#cdd6e0}
  </style>
</head>
<body>
  <div class="wrap">
    <p><a class="back" href="/">&larr; Back to predictor</a></p>
    <div id="content"></div>
  </div>
  <script id="md" type="text/markdown">{{ content|safe }}</script>
  <script>
    document.getElementById("content").innerHTML =
      marked.parse(document.getElementById("md").textContent);
  </script>
</body>
</html>
